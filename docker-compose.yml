services:
  disk-index:
    build: .
    container_name: disk-index
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      - API_KEY=${API_KEY}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-*}
      # Re-escaneo automático: todos los días a esa hora (o usá AUTO_SCAN_HOURS=24)
      - AUTO_SCAN_TIME=${AUTO_SCAN_TIME:-03:00}
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      # El índice persiste aunque el disco esté desconectado
      - disk-index-db:/app/db
      # Disco a indexar (solo lectura). El nombre después de /data/ es el nombre del disco.
      # Cambiá la ruta de la izquierda por donde esté montado tu disco en el host.
      - /mnt/disco1:/data/MiDisco:ro

volumes:
  disk-index-db:
